<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="../css/inventario.css">
    <meta charset="UTF-8">
    <title>Inventario</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

</head>

<body>

    <section class="section">

        <div class="container">

            <h1 class="title has-text-centered">
                Formulario Inventario
            </h1>

            <form>

                <div class="field">
                    <label class="label">Codigo Producto</label>

                    <div class="control">
                        <input class="input" id="codigo_producto" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Nombre Producto</label>

                    <div class="control">
                        <input class="input" id="nombre_producto" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Precio Unitario</label>

                    <div class="control">
                        <input class="input" id="precio_unitario"  type="number">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Cantidad Producto</label>

                    <div class="control">
                        <input class="input" id="cantidad_producto" type="number">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Marca Producto</label>

                    <div class="control">
                        <input class="input" id="marca_producto" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Categoria Producto</label>

                    <div class="control">
                        <input class="input" id="categoria_producto" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Unidad Medida</label>

                    <div class="control">
                        <input class="input" id="unidad_medida" type="text">
                    </div>
                </div>


               <div class="field is-grouped is-grouped-centered">
                <div class="control">
                    <button class="button is-success">Enviar</button>
                </div>
                <div class="control">
                    <a href="../index.html" class="button is-link">Volver al inicio</a>
                 </div>
          </div>

           </form>
        </div>
     </div>
