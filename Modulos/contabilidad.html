<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contabilidad</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

</head>

<body>

    <section class="section">

        <div class="container">

            <h1 class="title has-text-centered">
                Formulario Contabilidad
            </h1>

            <form>

                <div class="field">
                    <label class="label">Ventas</label>

                    <div class="control">
                        <input class="input" type="number">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Fecha</label>

                    <div class="control">
                        <input class="input" type="date">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Ingresos</label>

                    <div class="control">
                        <input class="input" type="number">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Egresos</label>

                    <div class="control">
                        <input class="input" type="number">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Concepto</label>

                    <div class="control">
                        <input class="input" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Valor</label>

                    <div class="control">
                        <input class="input" type="number">
                    </div>
                </div>

                <div class="field is-grouped is-grouped-centered">

                    <div class="control">
                        <button class="button is-success">
                            Enviar
                        </button>
                    </div>

                    <div class="control">
                        <a href="../index.html" class="button is-link">
                            Volver al inicio
                        </a>
                    </div>

                </div>

            </form>

        </div>

    </section>

</body>

</html>
