<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>

<body>

    <section class="section">

        <div class="container">

            <h1 class="title has-text-centered">
                Formulario Usuarios
            </h1>

            <form>

                <div class="field">
                    <label class="label">Codigo Usuario</label>

                    <div class="control">
                        <input class="input" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Nombre Usuario</label>

                    <div class="control">
                        <input class="input" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Apellido Usuario</label>

                    <div class="control">
                        <input class="input" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Correo Electronico</label>

                    <div class="control">
                        <input class="input" type="email">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Telefono Usuario</label>

                    <div class="control">
                        <input class="input" type="tel">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Direccion Usuario</label>

                    <div class="control">
                        <input class="input" type="text">
                    </div>
                </div>

                <div class="field">
                    <label class="label">Rol Usuario</label>

                    <div class="control">
                        <div class="select is-fullwidth">
                            <select>
                                <option value="cliente">Cliente</option>
                                <option value="empleado">Empleado</option>
                                <option value="administrador">Administrador</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Contraseña</label>

                    <div class="control">
                        <input class="input" type="password">
                    </div>
                </div>

                <div class="field is-grouped is-grouped-centered">
                    <div class="control">
                        <button type="button" class="button is-success">Enviar</button>
                    </div>

                    <div class="control">
                        <a href="../index.html" class="button is-link">
                            Volver al inicio
                        </a>
                    </div>
                </div>

            </form>

        </div>

    </section>

</body>

</html>
